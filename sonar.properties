sonar.projectKey=my-application
sonar.projectName=My Kubernetes App
sonar.projectVersion=1.0

# Source directories (matches your repo structure)
sonar.sources=argocd
sonar.tests=argocd
sonar.language=py
sonar.sourceEncoding=UTF-8

# Python-specific settings
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml

# Quality Gate — set to false so pipeline doesn't abort here
# (waitForQualityGate in Jenkinsfile handles this instead)
sonar.qualitygate.wait=false
