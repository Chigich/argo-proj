sonar.projectKey=argo-proj
sonar.projectName=My Kubernetes App
sonar.projectVersion=1.0

# Source directories
sonar.sources=src
sonar.tests=tests
sonar.language=py
sonar.sourceEncoding=UTF-8

# Python-specific settings
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12

# Quality Gate — pipeline will fail if these are not met
sonar.qualitygate.wait=true
